<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Animated profile banner">
  <rect width="100%" height="100%" fill="#0d1117" rx="18" />
  <rect x="18" y="18" width="864" height="244" rx="12" fill="#010409" stroke="#30363d" />
  <circle cx="44" cy="36" r="6" fill="#f85149"/><circle cx="66" cy="36" r="6" fill="#d29922"/><circle cx="88" cy="36" r="6" fill="#3fb950"/>
  <text x="120" y="40" font-size="14" fill="#8b949e" font-family="monospace">kavish@github:~$ ./init-profile</text>
  <style>
    .typed { font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 42px; fill: #3fb950; font-weight: 600; }
  </style>

  <defs>
    <clipPath id="lineClip0">
      <rect x="40" y="52" width="0" height="48">
        <animate attributeName="width" begin="0.35s" dur="1.1s" from="0" to="860" fill="freeze" />
      </rect>
    </clipPath>
  </defs>
  <br>
  <text x="40" y="86" class="typed" clip-path="url(#lineClip0)">Kavish Paraswar</text>

  <defs>
    <clipPath id="lineClip1">
      <rect x="40" y="114" width="0" height="48">
        <animate attributeName="width" begin="1.7000000000000002s" dur="1.1s" from="0" to="860" fill="freeze" />
      </rect>
    </clipPath>
  </defs>
  <text x="40" y="148" class="typed" clip-path="url(#lineClip1)">Software Engineer</text>

  <defs>
    <clipPath id="lineClip2">
      <rect x="40" y="176" width="0" height="48">
        <animate attributeName="width" begin="3.0500000000000003s" dur="1.1s" from="0" to="860" fill="freeze" />
      </rect>
    </clipPath>
  </defs>
  <text x="40" y="210" class="typed" clip-path="url(#lineClip2)">Building AI Products</text>
  <rect x="40" y="176" width="16" height="34" fill="#3fb950">
    <animate attributeName="x" begin="0.35s" dur="4.2s" values="40;780;780;650" keyTimes="0;0.36;0.7;1" fill="freeze" />
    <animate attributeName="y" begin="0.35s" dur="4.2s" values="52;52;114;176" keyTimes="0;0.36;0.7;1" fill="freeze" />
    <animate attributeName="opacity" begin="0.35s" dur="0.35s" values="1;0;1" repeatCount="12" />
    <set attributeName="opacity" to="0" begin="4.55s" />
  </rect>
</svg>
