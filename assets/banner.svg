<svg xmlns="http://www.w3.org/2000/svg" width="900" height="606" viewBox="0 0 900 606" role="img" aria-label="Animated profile boot banner">
  <rect width="100%" height="100%" fill="#0d1117" rx="16"/>
  <rect x="18" y="18" width="864" height="570" rx="12" fill="#010409" stroke="#21262d"/>
  <circle cx="42" cy="40" r="6" fill="#f85149"/><circle cx="62" cy="40" r="6" fill="#d29922"/><circle cx="82" cy="40" r="6" fill="#3fb950"/>
  <style>
    .prompt   { font-family: 'JetBrains Mono', monospace; font-size: 15px; fill: #7d8590; }
    .cmd      { font-family: 'JetBrains Mono', monospace; font-size: 17px; fill: #e6edf3; }
    .muted    { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #484f58; }
    .bar      { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #3fb950; }
    .greeting { font-family: 'JetBrains Mono', monospace; font-size: 20px; fill: #8b949e; }
    .name     { font-family: 'JetBrains Mono', monospace; font-size: 30px; fill: #e6edf3; font-weight: 700; }
    .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 17px; fill: #8b949e; }
    .interest { font-family: 'JetBrains Mono', monospace; font-size: 17px; fill: #e6edf3; }
    .focus    { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #7d8590; }
    .ready    { font-family: 'JetBrains Mono', monospace; font-size: 17px; fill: #3fb950; font-weight: 700; }
  </style>
  <text x="40" y="80" class="prompt" opacity="0">kavish@github:~$<animate attributeName="opacity" begin="0.20s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="40" y="116" class="cmd" opacity="0">./init-profile<animate attributeName="opacity" begin="0.45s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="40" y="160" class="muted" opacity="0">Loading modules...<animate attributeName="opacity" begin="0.75s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="40" y="192" class="bar" opacity="0">██████████████<animate attributeName="opacity" begin="1.05s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="40" y="244" class="greeting" opacity="0">Hey,<animate attributeName="opacity" begin="1.40s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="40" y="284" class="name" opacity="0">I'm Kavish Paraswar.<animate attributeName="opacity" begin="1.60s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="40" y="336" class="subtitle" opacity="0">I enjoy building<animate attributeName="opacity" begin="1.85s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="48" y="372" class="interest" opacity="0">• Backend Systems<animate attributeName="opacity" begin="2.05s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="48" y="404" class="interest" opacity="0">• AI-powered Products<animate attributeName="opacity" begin="2.20s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="48" y="436" class="interest" opacity="0">• Production Software<animate attributeName="opacity" begin="2.35s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="48" y="468" class="interest" opacity="0">• Open Source<animate attributeName="opacity" begin="2.50s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="40" y="518" class="focus" opacity="0">Currently focused on creating scalable software that solves real engineering problems.<animate attributeName="opacity" begin="2.75s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="40" y="566" class="ready" opacity="0">Ready_<animate attributeName="opacity" begin="3.05s" dur="0.15s" from="0" to="1" fill="freeze"/></text><rect x="118" y="550" width="10" height="20" fill="#3fb950" opacity="0"><animate attributeName="opacity" begin="3.05s" dur="0.01s" from="0" to="1" fill="freeze"/><animate attributeName="opacity" begin="3.10s" dur="1s" values="1;0;1" repeatCount="indefinite"/></rect>
</svg>