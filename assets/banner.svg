<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="Animated profile boot banner">
  <rect width="100%" height="100%" fill="#0d1117" rx="18" />
  <rect x="18" y="18" width="864" height="354" rx="12" fill="#010409" stroke="#30363d" />
  <style>
    .dots { font-family: 'JetBrains Mono', monospace; font-size: 20px; fill: #8b949e; }
    .boot { font-family: 'JetBrains Mono', monospace; font-size: 22px; fill: #8b949e; }
    .cmd { font-family: 'JetBrains Mono', monospace; font-size: 24px; fill: #c9d1d9; }
    .headline { font-family: 'JetBrains Mono', monospace; font-size: 30px; fill: #3fb950; font-weight: 700; }
    .name { font-family: 'JetBrains Mono', monospace; font-size: 34px; fill: #e6edf3; font-weight: 700; }
    .role { font-family: 'JetBrains Mono', monospace; font-size: 23px; fill: #8b949e; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 22px; fill: #3fb950; }
    .ok { font-family: 'JetBrains Mono', monospace; font-size: 22px; fill: #3fb950; }
  </style>
  <text x="40" y="48" class="dots" opacity="0">● ● ●<animate attributeName="opacity" begin="0.00s" dur="0.01s" from="0" to="1" fill="freeze"/></text><text x="40" y="80" class="boot" opacity="0">kavish@github:~$<animate attributeName="opacity" begin="0.28s" dur="0.01s" from="0" to="1" fill="freeze"/></text><text x="40" y="112" class="cmd" opacity="0">./init-profile<animate attributeName="opacity" begin="0.55s" dur="0.01s" from="0" to="1" fill="freeze"/></text><text x="40" y="148" class="boot" opacity="0">Loading modules...<animate attributeName="opacity" begin="0.90s" dur="0.01s" from="0" to="1" fill="freeze"/></text><text x="40" y="176" class="ok" opacity="0">████████████████████<animate attributeName="opacity" begin="1.25s" dur="0.01s" from="0" to="1" fill="freeze"/></text><text x="40" y="222" class="headline" opacity="0">WELCOME<animate attributeName="opacity" begin="1.70s" dur="0.01s" from="0" to="1" fill="freeze"/></text><text x="40" y="258" class="name" opacity="0">KAVISH PARASWAR<animate attributeName="opacity" begin="2.00s" dur="0.01s" from="0" to="1" fill="freeze"/></text><text x="40" y="292" class="role" opacity="0">Software Engineer<animate attributeName="opacity" begin="2.30s" dur="0.01s" from="0" to="1" fill="freeze"/></text><text x="40" y="324" class="tag" opacity="0">AI • Backend • Open Source<animate attributeName="opacity" begin="2.60s" dur="0.01s" from="0" to="1" fill="freeze"/></text><text x="40" y="356" class="ok" opacity="0">Ready.<animate attributeName="opacity" begin="2.90s" dur="0.01s" from="0" to="1" fill="freeze"/></text>

  <rect x="40" y="96" width="12" height="20" fill="#3fb950" opacity="1">
    <animate attributeName="x" begin="0.55s" dur="2.5s" values="40;228;40;280;120;520;120" fill="freeze" />
    <animate attributeName="y" begin="0.55s" dur="2.5s" values="96;96;132;132;206;206;350" fill="freeze" />
    <animate attributeName="opacity" begin="0.55s" dur="0.24s" values="1;0;1" repeatCount="indefinite" />
    <set attributeName="opacity" to="0" begin="3.15s" />
  </rect>
</svg>