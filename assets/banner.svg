<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="430"
     viewBox="0 0 900 430"
     role="img"
     aria-label="Animated Terminal Banner">

  <rect width="100%" height="100%" rx="18" fill="#0d1117"/>

  <rect
      x="18"
      y="18"
      width="864"
      height="394"
      rx="12"
      fill="#010409"
      stroke="#30363d"
      stroke-width="1"/>

  <style>

    .mono{
      font-family:
      "JetBrains Mono",
      "Cascadia Code",
      "SFMono-Regular",
      Consolas,
      "Liberation Mono",
      Menlo,
      monospace;
    }

    .title{
      font-size:22px;
      fill:#8b949e;
    }

    .cmd{
      font-size:24px;
      fill:#e6edf3;
    }

    .text{
      font-size:21px;
      fill:#c9d1d9;
    }

    .green{
      font-size:21px;
      fill:#39d353;
    }

    .white{
      font-size:22px;
      fill:#f0f6fc;
    }

    .cursor{
      fill:#39d353;
    }

  </style>

  <!-- Window controls -->

  <circle cx="42" cy="42" r="7" fill="#ff5f56"/>
  <circle cx="64" cy="42" r="7" fill="#ffbd2e"/>
  <circle cx="86" cy="42" r="7" fill="#27c93f"/>

  <!-- Prompt -->

  <text
      x="40"
      y="85"
      class="mono title"
      opacity="0">
      kavish@github:~$

      <animate
          attributeName="opacity"
          begin="0.2s"
          dur="0.01s"
          from="0"
          to="1"
          fill="freeze"/>
  </text>

  <!-- Command -->

  <text
      x="40"
      y="120"
      class="mono cmd"
      opacity="0">
      ./init-profile

      <animate
          attributeName="opacity"
          begin="0.55s"
          dur="0.01s"
          from="0"
          to="1"
          fill="freeze"/>
  </text>

  <!-- Boot -->

  <text
      x="40"
      y="160"
      class="mono text"
      opacity="0">
      booting profile...

      <animate
          attributeName="opacity"
          begin="0.9s"
          dur="0.01s"
          from="0"
          to="1"
          fill="freeze"/>
  </text>

  <!-- Progress Bar -->

  <rect
      x="40"
      y="180"
      width="320"
      height="14"
      rx="7"
      fill="#21262d"/>

  <rect
      x="40"
      y="180"
      width="0"
      height="14"
      rx="7"
      fill="#39d353">

      <animate
          attributeName="width"
          begin="1.2s"
          dur="0.8s"
          from="0"
          to="320"
          fill="freeze"/>

  </rect>

  <!-- First Status -->

  <text
      x="40"
      y="235"
      class="mono green"
      opacity="0">

      ✓ user detected

      <animate
          attributeName="opacity"
          begin="2.15s"
          dur="0.01s"
          from="0"
          to="1"
          fill="freeze"/>

  </text>

  <text
      x="40"
      y="268"
      class="mono green"
      opacity="0">

      ✓ profile loaded

      <animate
          attributeName="opacity"
          begin="2.45s"
          dur="0.01s"
          from="0"
          to="1"
          fill="freeze"/>

  </text>

  <text
      x="40"
      y="301"
      class="mono green"
      opacity="0">

      ✓ environment initialized

      <animate
          attributeName="opacity"
          begin="2.75s"
          dur="0.01s"
          from="0"
          to="1"
          fill="freeze"/>

  </text>
    <!-- Identity -->

  <text
      x="40"
      y="340"
      class="mono white"
      opacity="0">

      name       kavish paraswar

      <animate
          attributeName="opacity"
          begin="3.15s"
          dur="0.01s"
          from="0"
          to="1"
          fill="freeze"/>

  </text>

  <text
      x="40"
      y="370"
      class="mono text"
      opacity="0">

      role       software engineer intern

      <animate
          attributeName="opacity"
          begin="3.45s"
          dur="0.01s"
          from="0"
          to="1"
          fill="freeze"/>

  </text>

  <text
      x="40"
      y="400"
      class="mono green"
      opacity="0">

      love to work on   ai • backend • open source

      <animate
          attributeName="opacity"
          begin="3.75s"
          dur="0.01s"
          from="0"
          to="1"
          fill="freeze"/>

  </text>

  <!-- <text
      x="510"
      y="400"
      class="mono green"
      opacity="0">

      system ready.

      <animate
          attributeName="opacity"
          begin="4.10s"
          dur="0.01s"
          from="0"
          to="1"
          fill="freeze"/>

  </text> -->


<text
    x="615"
    y="404"
    class="mono green"
    opacity="0">█

    <set
        attributeName="opacity"
        to="1"
        begin="4.4s"
        fill="freeze"/>

    <animate
        attributeName="opacity"
        values="1;0;1"
        begin="4.4s"
        dur="0.8s"
        repeatCount="indefinite"/>

</text>

</svg>
