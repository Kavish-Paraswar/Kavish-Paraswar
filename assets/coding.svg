<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Coding profiles">
  <rect width="100%" height="100%" fill="#0d1117" rx="14" />
  <rect x="12" y="12" width="876" height="226" rx="10" fill="#010409" stroke="#30363d" />
  <text x="24" y="36" font-family="monospace" font-size="14" fill="#8b949e">kavish@github:~$ cat coding.json</text>
  <style>
    .label { font-family: 'JetBrains Mono', monospace; font-size: 22px; fill: #3fb950; font-weight: 700; }
    .value { font-family: 'JetBrains Mono', monospace; font-size: 22px; fill: #c9d1d9; }
  </style>

  <g opacity="0" transform="translate(0,12)">
    <animate attributeName="opacity" begin="0.28s" dur="0.24s" from="0" to="1" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" begin="0.28s" dur="0.24s" from="0 12" to="0 0" fill="freeze" />
    <text x="28" y="84" class="label">LeetCode</text>
    <text x="186" y="84" class="value">Knight</text>
  </g>

  <g opacity="0" transform="translate(0,12)">
    <animate attributeName="opacity" begin="0.5s" dur="0.24s" from="0" to="1" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" begin="0.5s" dur="0.24s" from="0 12" to="0 0" fill="freeze" />
    <text x="28" y="126" class="label">CodeChef</text>
    <text x="186" y="126" class="value">3★</text>
  </g>

  <g opacity="0" transform="translate(0,12)">
    <animate attributeName="opacity" begin="0.72s" dur="0.24s" from="0" to="1" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" begin="0.72s" dur="0.24s" from="0 12" to="0 0" fill="freeze" />
    <text x="28" y="168" class="label">Codeforces</text>
    <text x="186" y="168" class="value">Specialist</text>
  </g>
</svg>