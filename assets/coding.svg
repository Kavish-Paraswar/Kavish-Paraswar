<svg xmlns="http://www.w3.org/2000/svg" width="900" height="216" viewBox="0 0 900 216" role="img" aria-label="Coding profiles">
  <rect width="100%" height="100%" fill="#0d1117" rx="16"/>
  <rect x="18" y="18" width="864" height="180" rx="12" fill="#010409" stroke="#21262d"/>
  <circle cx="42" cy="40" r="6" fill="#f85149"/><circle cx="62" cy="40" r="6" fill="#d29922"/><circle cx="82" cy="40" r="6" fill="#3fb950"/>
  <text x="40" y="62" class="prompt">$ cat coding-profiles.log</text>
  <style>
    .prompt   { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #7d8590; }
    .platform { font-family: 'JetBrains Mono', monospace; font-size: 16px; fill: #3fb950; font-weight: 700; }
    .tier     { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; }
    .rating   { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; }
    .extra    { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #7d8590; }
  </style>
  <g opacity="0"><animate attributeName="opacity" begin="0.15s" dur="0.15s" from="0" to="1" fill="freeze"/><rect x="40" y="76" width="260" height="110" rx="10" fill="#0d1117" stroke="#21262d"/><text x="60" y="106" class="platform">LeetCode</text><text x="60" y="131" class="tier" fill="#3fb950">Knight</text><text x="60" y="152" class="rating">Max Rating: 1869</text><text x="60" y="170" class="extra">Top 5%</text></g><g opacity="0"><animate attributeName="opacity" begin="0.30s" dur="0.15s" from="0" to="1" fill="freeze"/><rect x="324" y="76" width="260" height="110" rx="10" fill="#0d1117" stroke="#21262d"/><text x="344" y="106" class="platform">CodeChef</text><text x="344" y="131" class="tier" fill="#e6edf3">3★</text><text x="344" y="152" class="rating">Max Rating: 1604</text><text x="344" y="170" class="extra">AIR 71</text></g><g opacity="0"><animate attributeName="opacity" begin="0.45s" dur="0.15s" from="0" to="1" fill="freeze"/><rect x="608" y="76" width="260" height="110" rx="10" fill="#0d1117" stroke="#21262d"/><text x="628" y="106" class="platform">Codeforces</text><text x="628" y="131" class="tier" fill="#3fb950">Specialist</text><text x="628" y="152" class="rating">Max Rating: 1414</text><text x="628" y="170" class="extra"></text></g>
</svg>