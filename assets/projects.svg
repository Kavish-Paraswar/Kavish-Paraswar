<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Featured projects">
  <rect width="100%" height="100%" fill="#0d1117" rx="16"/>
  <rect x="18" y="18" width="864" height="484" rx="12" fill="#010409" stroke="#21262d"/>

  <circle cx="42" cy="40" r="6" fill="#f85149"/>
  <circle cx="62" cy="40" r="6" fill="#d29922"/>
  <circle cx="82" cy="40" r="6" fill="#3fb950"/>

  <text x="40" y="62" class="prompt">$ ls featured-projects/</text>

  <style>
    .prompt { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #7d8590; }
    .title  { font-family: 'JetBrains Mono', monospace; font-size: 20px; fill: #3fb950; font-weight: 700; }
    .desc   { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #e6edf3; }
    .metric { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; }
    .stack  { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #3fb950; opacity: 0.85; }
  </style>

  <g transform="translate(32,80)" opacity="0">
    <animate attributeName="opacity" begin="0.20s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <rect width="836" height="190" rx="10" fill="#0d1117" stroke="#21262d"/>

    <text x="32" y="34" class="title">Smart Krishi</text>
    <line x1="32" y1="50" x2="804" y2="50" stroke="#21262d" stroke-width="1"/>

    <text x="32" y="76" class="desc">AI-powered platform for crop intelligence and farmer assistance.</text>

    <text x="32" y="112" class="metric">▸ 98.9% disease prediction accuracy on 61K images</text>
    <text x="32" y="138" class="metric">▸ 97% yield prediction accuracy with AI voice assistance</text>
    <text x="32" y="166" class="stack">Tech: React · TypeScript · FastAPI · MySQL · Docker · Hugging Face</text>
  </g>

  <g transform="translate(32,290)" opacity="0">
    <animate attributeName="opacity" begin="0.45s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <rect width="836" height="190" rx="10" fill="#0d1117" stroke="#21262d"/>

    <text x="32" y="34" class="title">Sketch2Face AI</text>
    <line x1="32" y1="50" x2="804" y2="50" stroke="#21262d" stroke-width="1"/>

    <text x="32" y="76" class="desc">AI system converting hand-drawn sketches into photorealistic faces.</text>

    <text x="32" y="112" class="metric">▸ 95% facial reconstruction accuracy</text>
    <text x="32" y="138" class="metric">▸ Fine-tuned Conditional GAN on 30K facial images</text>
    <text x="32" y="166" class="stack">Tech: React · FastAPI · Python · CNN · GAN</text>
  </g>
</svg>