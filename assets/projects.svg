<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Featured projects">
  <rect width="100%" height="100%" fill="#0d1117" rx="14"/>
  <rect x="12" y="12" width="876" height="446" rx="10" fill="#010409" stroke="#30363d"/>
