  <g transform="translate(32,76)" opacity="0"><animate attributeName="opacity" begin="0.20s" dur="0.2s" from="0" to="1" fill="freeze"/><rect width="836" height="346" rx="10" fill="#0d1117" stroke="#21262d"/><text x="24" y="30" class="title">Smart Krishi</text><line x1="24" y1="44" x2="812" y2="44" stroke="#21262d" stroke-width="1"/><text x="24" y="66" class="desc">One-stop AI platform for farmers integrating crop disease prediction using KNN optimized on 61K</text><text x="24" y="86" class="desc">images with 98.9% accuracy, crop/fertilizer/yield prediction, multilingual voice navigation,</text><text x="24" y="106" class="desc">and a Twilio-based AI voice call agent enabling farmers to receive recommendations via phone</text><text x="24" y="126" class="desc">calls.</text><text x="24" y="156" class="section-hdr">Key Metrics:</text><text x="36" y="176" class="metric">▸ 98.9% crop disease accuracy on 61K images</text><text x="36" y="194" class="metric">▸ 97% yield prediction accuracy</text><text x="36" y="212" class="metric">▸ Integrated Twilio AI voice call agent</text><text x="36" y="230" class="metric">▸ Multilingual voice-based navigation &amp; PAN auth</text><text x="24" y="258" class="stack">Tech Stack: React · TypeScript · Flask · MySQL · Hugging Face · Docker · Vercel</text><a href="https://github.com/Kavish-Paraswar"><rect x="24" y="292" width="110" height="30" rx="6" fill="#21262d" stroke="#30363d"/><text x="42" y="312" class="btn">GitHub ↗</text></a></g><g transform="translate(32,446)" opacity="0"><animate attributeName="opacity" begin="0.45s" dur="0.2s" from="0" to="1" fill="freeze"/><rect width="836" height="288" rx="10" fill="#0d1117" stroke="#21262d"/><text x="24" y="30" class="title">Sketch2Face AI</text><line x1="24" y1="44" x2="812" y2="44" stroke="#21262d" stroke-width="1"/><text x="24" y="66" class="desc">AI system converting hand-drawn sketches into photorealistic human faces using Conditional GAN,</text><text x="24" y="86" class="desc">fine-tuned on 30K facial images with 95% reconstruction accuracy.</text><text x="24" y="116" class="section-hdr">Key Metrics:</text><text x="36" y="136" class="metric">▸ 95% facial reconstruction accuracy</text><text x="36" y="154" class="metric">▸ Fine-tuned on 30K facial images</text><text x="36" y="172" class="metric">▸ Conditional GAN &amp; CNN architecture</text><text x="24" y="200" class="stack">Tech Stack: React · Flask · Python · CNN · GAN</text><a href="https://github.com/Kavish-Paraswar"><rect x="24" y="234" width="110" height="30" rx="6" fill="#21262d" stroke="#30363d"/><text x="42" y="254" class="btn">GitHub ↗</text></a></g>
