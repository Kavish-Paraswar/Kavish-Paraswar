<svg xmlns="http://www.w3.org/2000/svg" width="900" height="224" viewBox="0 0 900 224" role="img" aria-label="Achievements">
  <rect width="100%" height="100%" fill="#0d1117" rx="16"/>
  <rect x="18" y="18" width="864" height="188" rx="12" fill="#010409" stroke="#21262d"/>
  <circle cx="42" cy="40" r="6" fill="#f85149"/><circle cx="62" cy="40" r="6" fill="#d29922"/><circle cx="82" cy="40" r="6" fill="#3fb950"/>
  <text x="40" y="62" class="prompt">$ cat achievements.log</text>
  <style>
    .prompt    { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #7d8590; }
    .card-bg   { fill: #0d1117; stroke: #21262d; stroke-width: 1.5; transition: all 0.2s ease; }
    .title     { font-family: 'JetBrains Mono', monospace; font-size: 16px; fill: #3fb950; font-weight: 700; }
    .subtitle  { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #e6edf3; }
    .card-group:hover .card-bg { stroke: #3fb950; fill: #161b22; }
  </style>
  <g class="card-group" opacity="0"><animate attributeName="opacity" begin="0.15s" dur="0.15s" from="0" to="1" fill="freeze"/><rect x="40" y="76" width="395" height="120" rx="10" class="card-bg"/><text x="122" y="126" class="title">Amazon ML Summer School 2026</text><text x="122" y="152" class="subtitle">Shortlisted</text></g><g class="card-group" opacity="0"><animate attributeName="opacity" begin="0.30s" dur="0.15s" from="0" to="1" fill="freeze"/><rect x="469" y="76" width="395" height="120" rx="10" class="card-bg"/><text x="551" y="126" class="title">Flipkart GRID 8.0</text><text x="551" y="152" class="subtitle">National Semi-Finalists</text></g>
</svg>