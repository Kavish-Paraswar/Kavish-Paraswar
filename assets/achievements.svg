<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="360"
     viewBox="0 0 900 360"
     role="img"
     aria-label="Achievements">

    <!-- Background -->
    <rect width="100%" height="100%" fill="#0d1117" rx="16"/>

    <!-- Terminal -->
    <rect x="18"
          y="18"
          width="864"
          height="324"
          rx="12"
          fill="#010409"
          stroke="#21262d"/>

    <!-- Window Buttons -->
    <circle cx="42" cy="40" r="6" fill="#f85149"/>
    <circle cx="62" cy="40" r="6" fill="#d29922"/>
    <circle cx="82" cy="40" r="6" fill="#3fb950"/>

    <style>
        .prompt{
            font-family:'JetBrains Mono',monospace;
            font-size:14px;
            fill:#7d8590;
        }

        .ach{
            font-family:'JetBrains Mono',monospace;
            font-size:13px;
            fill:#e6edf3;
        }

        .title{
            fill:#3fb950;
            font-weight:bold;
        }
    </style>

    <text x="40" y="62" class="prompt">$ cat achievements.log</text>

    <!-- Card 1 -->
    <g opacity="0">
        <animate attributeName="opacity"
                 begin="0.15s"
                 dur="0.12s"
                 from="0"
                 to="1"
                 fill="freeze"/>

        <rect x="36"
              y="72"
              width="830"
              height="46"
              rx="8"
              fill="#0d1117"
              stroke="#21262d"/>

        <text x="50" y="99" class="ach">
            🥇 Winner of CodeMania 6.0 &amp; Codeverse 2k26 Hackathons
        </text>
    </g>

    <!-- Card 2 -->
    <g opacity="0">
        <animate attributeName="opacity"
                 begin="0.25s"
                 dur="0.12s"
                 from="0"
                 to="1"
                 fill="freeze"/>

        <rect x="36"
              y="128"
              width="830"
              height="46"
              rx="8"
              fill="#0d1117"
              stroke="#21262d"/>

        <text x="50" y="155" class="ach">
            📊 AIR 71 (Starters 215) • AIR 168 (Starters 214) on CodeChef
        </text>
    </g>

    <!-- Card 3 -->
    <g opacity="0">
        <animate attributeName="opacity"
                 begin="0.35s"
                 dur="0.12s"
                 from="0"
                 to="1"
                 fill="freeze"/>

        <rect x="36"
              y="184"
              width="830"
              height="58"
              rx="8"
              fill="#0d1117"
              stroke="#21262d"/>

        <text x="50" y="208" class="ach">
            ⭐ CodeChef: 3★ (Max Rating 1604)
        </text>

        <text x="50" y="228" class="ach">
            ↗ Codeforces: Specialist (Max Rating 1414)
        </text>
    </g>

    <!-- Card 4 -->
    <g opacity="0">
        <animate attributeName="opacity"
                 begin="0.45s"
                 dur="0.12s"
                 from="0"
                 to="1"
                 fill="freeze"/>

        <rect x="36"
              y="252"
              width="830"
              height="58"
              rx="8"
              fill="#0d1117"
              stroke="#21262d"/>

        <text x="50" y="276" class="ach">
            🎓 Amazon ML Summer School Participant
        </text>

        <text x="50" y="296" class="ach">
            🚀 Flipkart GRID 8.0 Semifinalist
        </text>
    </g>

</svg>
