<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Experience timeline">
  <rect width="100%" height="100%" fill="#0d1117" rx="16"/>
  <rect x="18" y="18" width="864" height="264" rx="12" fill="#010409" stroke="#21262d"/>

  <circle cx="42" cy="40" r="6" fill="#f85149"/>
  <circle cx="62" cy="40" r="6" fill="#d29922"/>
  <circle cx="82" cy="40" r="6" fill="#3fb950"/>

  <text x="40" y="62" class="prompt">$ cat experience.log</text>

  <style>
    .prompt     { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #7d8590; }
    .role-title { font-family: 'JetBrains Mono', monospace; font-size: 17px; fill: #e6edf3; font-weight: 700; }
    .duration   { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #3fb950; }
    .bullet     { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; }
    .tech-tag   { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #3fb950; opacity: 0.85; }
  </style>

  <line x1="52" y1="90" x2="52" y2="248" stroke="#21262d" stroke-width="2"/>

  <circle cx="52" cy="90" r="6" fill="#3fb950" stroke="#010409" stroke-width="2"/>

  <text x="74" y="95" class="role-title" opacity="0">
    Software Engineering Intern @ Barclays
    <animate attributeName="opacity" begin="0.20s" dur="0.15s" from="0" to="1" fill="freeze"/>
  </text>

  <text x="836" y="95" class="duration" text-anchor="end" opacity="0">
    June 2026 – July 2026
    <animate attributeName="opacity" begin="0.20s" dur="0.15s" from="0" to="1" fill="freeze"/>
  </text>

  <text x="74" y="122" class="bullet" opacity="0">
    • Built a health monitoring system for microservices
    <animate attributeName="opacity" begin="0.30s" dur="0.12s" from="0" to="1" fill="freeze"/>
  </text>

  <text x="74" y="146" class="bullet" opacity="0">
    • Reduced MTTR by 70% across 250+ system resources
    <animate attributeName="opacity" begin="0.35s" dur="0.12s" from="0" to="1" fill="freeze"/>
  </text>

  <text x="74" y="170" class="tech-tag" opacity="0">
    Node.js  ·  OpenShift  ·  Kubernetes  ·  Kafka  ·  ELK
    <animate attributeName="opacity" begin="0.40s" dur="0.12s" from="0" to="1" fill="freeze"/>
  </text>

  <circle cx="52" cy="210" r="6" fill="#3fb950" stroke="#010409" stroke-width="2"/>

  <text x="74" y="215" class="role-title" opacity="0">
    AI Intern @ TakeTwo
    <animate attributeName="opacity" begin="0.50s" dur="0.15s" from="0" to="1" fill="freeze"/>
  </text>

  <text x="836" y="215" class="duration" text-anchor="end" opacity="0">
    Jan 2026 – Mar 2026
    <animate attributeName="opacity" begin="0.50s" dur="0.15s" from="0" to="1" fill="freeze"/>
  </text>

  <text x="74" y="242" class="bullet" opacity="0">
    • Built 12+ features for an AI video generation platform
    <animate attributeName="opacity" begin="0.60s" dur="0.12s" from="0" to="1" fill="freeze"/>
  </text>

  <text x="74" y="266" class="bullet" opacity="0">
    • Cut pipeline costs by 30% and generation latency by 40%
    <animate attributeName="opacity" begin="0.65s" dur="0.12s" from="0" to="1" fill="freeze"/>
  </text>

  <text x="74" y="290" class="tech-tag" opacity="0">
    Python  ·  AI  ·  React  ·  Node.js
    <animate attributeName="opacity" begin="0.70s" dur="0.12s" from="0" to="1" fill="freeze"/>
  </text>
</svg>
