<svg xmlns="http://www.w3.org/2000/svg" width="900" height="482" viewBox="0 0 900 482" role="img" aria-label="Experience timeline">

  <rect width="100%" height="100%" fill="#0d1117" rx="16"/>
  <rect x="18" y="18" width="864" height="446" rx="12" fill="#010409" stroke="#21262d"/>

  <circle cx="42" cy="40" r="6" fill="#f85149"/>
  <circle cx="62" cy="40" r="6" fill="#d29922"/>
  <circle cx="82" cy="40" r="6" fill="#3fb950"/>

  <text x="40" y="68" class="prompt">$ cat experience.log</text>

  <style>
