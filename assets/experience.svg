<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Experience card">
  <rect width="100%" height="100%" fill="#0d1117" rx="14" />
  <rect x="12" y="12" width="876" height="406" rx="10" fill="#010409" stroke="#30363d" />
  <text x="24" y="36" font-family="monospace" font-size="14" fill="#8b949e">kavish@github:~$ cat experience.log</text>
  <style>
    .company { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; fill: #3fb950; }
    .role { font-family: 'JetBrains Mono', monospace; font-size: 18px; fill: #c9d1d9; }
    .bullet { font-family: 'JetBrains Mono', monospace; font-size: 17px; fill: #8b949e; }
  </style>

  <g opacity="0">
    <animate attributeName="opacity" begin="0.25s" dur="0.25s" from="0" to="1" fill="freeze" />
    <text x="34" y="80" class="company">TakeTwo</text>
    <text x="280" y="80" class="role">AI Software Engineering Intern</text>
  </g>

  <g opacity="0" transform="translate(0,10)">
    <animate attributeName="opacity" begin="0.47s" dur="0.22s" from="0" to="1" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" begin="0.47s" dur="0.22s" from="0 10" to="0 0" fill="freeze" />
    <text x="52" y="114" class="bullet">• Built AI-powered features for a production video generation platform</text>
  </g>

  <g opacity="0" transform="translate(0,10)">
    <animate attributeName="opacity" begin="0.69s" dur="0.22s" from="0" to="1" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" begin="0.69s" dur="0.22s" from="0 10" to="0 0" fill="freeze" />
    <text x="52" y="144" class="bullet">• Improved generation pipelines and product workflows</text>
  </g>

  <g opacity="0" transform="translate(0,10)">
    <animate attributeName="opacity" begin="0.91s" dur="0.22s" from="0" to="1" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" begin="0.91s" dur="0.22s" from="0 10" to="0 0" fill="freeze" />
    <text x="52" y="174" class="bullet">• Delivered production-ready features across multiple modules</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="1.13s" dur="0.25s" from="0" to="1" fill="freeze" />
    <text x="34" y="228" class="company">Barclays</text>
    <text x="280" y="228" class="role">Software Engineering Intern</text>
  </g>

  <g opacity="0" transform="translate(0,10)">
    <animate attributeName="opacity" begin="1.35s" dur="0.22s" from="0" to="1" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" begin="1.35s" dur="0.22s" from="0 10" to="0 0" fill="freeze" />
    <text x="52" y="262" class="bullet">• Built an internal deployment monitoring system</text>
  </g>

  <g opacity="0" transform="translate(0,10)">
    <animate attributeName="opacity" begin="1.57s" dur="0.22s" from="0" to="1" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" begin="1.57s" dur="0.22s" from="0 10" to="0 0" fill="freeze" />
    <text x="52" y="292" class="bullet">• Integrated enterprise APIs across OpenShift environments</text>
  </g>

  <g opacity="0" transform="translate(0,10)">
    <animate attributeName="opacity" begin="1.79s" dur="0.22s" from="0" to="1" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" begin="1.79s" dur="0.22s" from="0 10" to="0 0" fill="freeze" />
    <text x="52" y="322" class="bullet">• Improved deployment validation efficiency</text>
  </g>
</svg>