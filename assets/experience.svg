  <circle cx="52" cy="90" r="6" fill="#3fb950" stroke="#010409" stroke-width="2"/><text x="74" y="95" class="role-title" opacity="0">Software Engineering Intern @ Barclays<animate attributeName="opacity" begin="0.20s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="836" y="95" class="duration" text-anchor="end" opacity="0">June 2026 – July 2026<animate attributeName="opacity" begin="0.20s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="74" y="116" class="bullet" opacity="0">• Architected a Health Monitoring &amp; Observability System for microservices<animate attributeName="opacity" begin="0.30s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="136" class="bullet" opacity="0">  architecture<animate attributeName="opacity" begin="0.30s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="156" class="bullet" opacity="0">• Deployed on Kubernetes/OpenShift monitoring 250+ active system resources<animate attributeName="opacity" begin="0.35s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="176" class="bullet" opacity="0">• Achieved 2–3 second dashboard load times and 500 ms–2 s query latency<animate attributeName="opacity" begin="0.40s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="196" class="bullet" opacity="0">• Implemented token refresh mechanism ensuring zero-downtime authentication<animate attributeName="opacity" begin="0.45s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="216" class="bullet" opacity="0">• Reduced deployment validation time by 15–20 minutes and overall MTTR by 70%<animate attributeName="opacity" begin="0.50s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="242" class="tech-tag" opacity="0">Node.js  ·  OpenShift  ·  Kubernetes  ·  Kafka  ·  ELK<animate attributeName="opacity" begin="0.55s" dur="0.12s" from="0" to="1" fill="freeze"/></text><circle cx="52" cy="296" r="6" fill="#3fb950" stroke="#010409" stroke-width="2"/><text x="74" y="301" class="role-title" opacity="0">AI Intern @ TakeTwo<animate attributeName="opacity" begin="0.55s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="836" y="301" class="duration" text-anchor="end" opacity="0">Jan 2026 – Mar 2026<animate attributeName="opacity" begin="0.55s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="74" y="322" class="bullet" opacity="0">• Worked on a production-grade AI video generation platform for the film industry<animate attributeName="opacity" begin="0.65s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="342" class="bullet" opacity="0">• Delivered 12+ core features including AI music generator and Canvas-style builder<animate attributeName="opacity" begin="0.70s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="362" class="bullet" opacity="0">• Reduced overall costs by 30% through pipeline optimization<animate attributeName="opacity" begin="0.75s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="382" class="bullet" opacity="0">• Improved generation latency by 40%<animate attributeName="opacity" begin="0.80s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="408" class="tech-tag" opacity="0">Python  ·  AI  ·  Video Generation  ·  Pipeline Optimization<animate attributeName="opacity" begin="0.85s" dur="0.12s" from="0" to="1" fill="freeze"/></text>
