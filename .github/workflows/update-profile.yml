name: Update Profile Assets

on:
  workflow_dispatch:
  schedule:
    # 01:30 UTC = 07:00 IST — daily scheduled run
    - cron: "30 1 * * *"
  push:
    branches: [main]
    paths:
      - "data/profile.json"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Regenerate terminal assets
        run: |
          python scripts/banner_generator.py
          python scripts/experience_generator.py
          python scripts/info_card_generator.py
          python scripts/tech_stack_generator.py
          python scripts/projects_generator.py
          python scripts/resume_button_generator.py
          python scripts/footer_generator.py

      - name: Verify generated SVG assets
        run: |
          echo "=== Verifying SVG Files ==="
          test -f assets/banner.svg
          test -f assets/experience.svg
          test -f assets/achievements.svg
          test -f assets/coding.svg
          test -f assets/currently.svg
          test -f assets/tech-stack.svg
          test -f assets/projects.svg
          test -f assets/resume-button.svg
          test -f assets/footer.svg
          echo "All required SVGs verified successfully."
          echo "=== Git Status ==="
          git status
          echo "=== Git Diff Stat ==="
          git diff --stat

      - name: Sync generated changes with latest main
        run: |
          git config user.name "Kavish Paraswar"
          git config user.email "kavishp9721@gmail.com"
          git fetch origin main
          git merge --ff-only origin/main

      - name: Commit generated changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): refresh generated assets"
          commit_user_name: "Kavish Paraswar"
          commit_user_email: "kavishp9721@gmail.com"
          commit_author: "Kavish Paraswar <kavishp9721@gmail.com>"
          file_pattern: assets/*.svg assets/**/*.svg
          push_options: --force-with-lease
