name: Update Profile Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"
  push:
    branches: [main]
    paths:
      - "data/profile.json"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

concurrency:
  group: update-profile-assets-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Regenerate terminal assets
        run: |
          python -m py_compile scripts/banner_generator.py
          python scripts/banner_generator.py
          python scripts/experience_generator.py
          python scripts/info_card_generator.py
          python scripts/tech_stack_generator.py
          python scripts/projects_generator.py
          python scripts/resume_button_generator.py
          python scripts/footer_generator.py

      - name: Verify generated SVG assets
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          required = [
              "assets/banner.svg",
              "assets/experience.svg",
              "assets/achievements.svg",
              "assets/coding.svg",
              "assets/currently.svg",
              "assets/tech-stack.svg",
              "assets/projects.svg",
              "assets/resume-button.svg",
              "assets/footer.svg",
          ]

          for filename in required:
              path = Path(filename)
              if not path.is_file():
                  raise SystemExit(f"Missing generated asset: {filename}")
              ET.parse(path)
              print(f"OK: {filename}")
          PY

      - name: Commit and push generated changes
        run: |
          git config user.name "Kavish Paraswar"
          git config user.email "kavishp9721@gmail.com"
          git add assets/*.svg assets/**/*.svg

          if git diff --cached --quiet; then
            echo "No generated SVG changes."
            exit 0
          fi

          git commit -m "chore(profile): refresh generated assets"
          git fetch origin main
          git rebase origin/main
          git push origin main
