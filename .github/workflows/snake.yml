name: Generate Snake Animation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kavish-Paraswar
          outputs: |
            assets/snake/snake.svg
            assets/snake/snake-dark.svg

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(snake): refresh snake animation"
          commit_user_name: "Kavish Paraswar"
          commit_user_email: "kavishp9721@gmail.com"
          commit_author: "Kavish Paraswar <kavishp9721@gmail.com>"
          file_pattern: assets/snake/snake.svg assets/snake/snake-dark.svg
