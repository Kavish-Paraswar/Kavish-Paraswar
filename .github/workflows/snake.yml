name: Generate Snake Animation

on:
  schedule:
    # 02:25 UTC = 07:55 IST — runs every morning after contribution refresh
    - cron: "25 2 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kavish-Paraswar
          outputs: assets/snake/snake.svg

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(snake): refresh snake animation"
          commit_user_name: "Kavish Paraswar"
          commit_user_email: "kavishp9721@gmail.com"
          commit_author: "Kavish Paraswar <kavishp9721@gmail.com>"
          file_pattern: assets/snake/snake.svg
